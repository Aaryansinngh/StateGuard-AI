<h1>🚀 StateGuard AI Dashboard</h1>

<!-- CONFIG -->
<div class="card">

    <button onclick="verifyModel()">Run Verification</button>
</div>

<!-- RESULTS -->
 <div class="card">
    <button onclick="downloadReport()">Download Report</button>
    <button onclick="compareModels()">Compare Last 2 Runs</button>
    <p id="comparisonResult"></p>
</div>

</div>

<script>
let ageChart;
let history = [];

function updateUI() {
    const type = document.getElementById("model_type").value;
    document.getElementById("rule").style.display = type === "rule" ? "block" : "none";
}

async function verifyModel() {

    document.getElementById("analysisSection").style.display = "block";
    document.getElementById("totalStates").innerText = "Loading...";

    const type = document.getElementById("model_type").value;
    const rule = document.getElementById("rule").value;
    const fileInput = document.getElementById("file");

    const formData = new FormData();
    formData.append("model_type", type);
    formData.append("rule", rule);

    if (fileInput.files.length > 0) {
        formData.append("file", fileInput.files[0]);
    }

    const response = await fetch("/verify_model", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    history.push(data);

    renderMetrics(data);
    renderChart(data);
    renderTable(data);
    generateInsight(data);
}

function renderMetrics(data) {
    document.getElementById("totalStates").innerText = data.total_states_checked;

    document.getElementById("violations").innerHTML =
        `<span class="${data.violations > 0 ? 'danger' : 'success'}">${data.violations}</span>`;

    document.getElementById("biasScore").innerText = data.bias_score;
    document.getElementById("riskScore").innerText = data.risk_score;

    document.getElementById("critical").innerText = data.severity_breakdown.CRITICAL;
    document.getElementById("high").innerText = data.severity_breakdown.HIGH;
    document.getElementById("medium").innerText = data.severity_breakdown.MEDIUM;
}

function renderChart(data) {

    const ageData = data.approval_rates_by_age || {
        "18-25": 0.5,
        "26-35": 0.6,
        "36-50": 0.4,
        "50+": 0.3
    };

    const ages = Object.keys(ageData);
    const rates = Object.values(ageData);

    if (ageChart) ageChart.destroy();

    ageChart = new Chart(document.getElementById("ageChart"), {
        type: "bar",
        data: {
            labels: ages,
            datasets: [{
                label: "Approval Rate",
                data: rates
            }]
        }
    });
}

function renderTable(data) {

    let html = `
        <table>
            <tr>
                <th>Income</th>
                <th>Credit</th>
                <th>Age</th>
                <th>Output</th>
                <th>Violation</th>
            </tr>
    `;

    const examples = data.counterexamples || [];

let html = "";

// 🚨 HANDLE EMPTY CASE
if (examples.length === 0) {
    html = "<p style='color:lightgreen;'>No violations found 🎉</p>";
} else {

    html = `
        <table>
            <tr>
                <th>Income</th>
                <th>Credit Score</th>
                <th>Age</th>
                <th>Output</th>
                <th>Violations</th>
            </tr>
    `;

    examples.forEach(v => {
        html += `
            <tr>
                <td>${v.state?.income ?? "-"}</td>
                <td>${v.state?.credit_score ?? "-"}</td>
                <td>${v.state?.age ?? "-"}</td>
                <td class="danger">${v.output ?? "-"}</td>
                <td>${v.violated_properties ? v.violated_properties.join(", ") : "-"}</td>
            </tr>
        `;
    });

    html += "</table>";
}

// ✅ FINAL RENDER
document.getElementById("counterTable").innerHTML = html;
}

function generateInsight(data) {

    let text = "";

    if (!data || Object.keys(data).length === 0) {
        text = "⚠️ No data received from backend.";
    }
    else if (data.violations === 0) {
        text = "✅ Model is SAFE.";
    } else {
        text = `⚠️ ${data.violations} unsafe decisions detected.`;
    }

    if (data.risk_score && data.risk_score > 0.3)
        text += " 🚨 HIGH RISK.";

    if (data.bias_score && data.bias_score > 0.3)
        text += " ⚠️ Bias detected.";

    document.getElementById("insightText").innerText = text;
}

function downloadReport() {

    let text = `
STATEGUARD AI REPORT

Total States: ${document.getElementById("totalStates").innerText}
Violations: ${document.getElementById("violations").innerText}
Bias Score: ${document.getElementById("biasScore").innerText}
Risk Score: ${document.getElementById("riskScore").innerText}
`;

    const blob = new Blob([text], { type: "text/plain" });
    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "report.txt";
    a.click();
}

function compareModels() {

    if (history.length < 2) {
        document.getElementById("comparisonResult").innerText = "Run 2 models first!";
        return;
    }

    const m1 = history[history.length - 2];
    const m2 = history[history.length - 1];

    document.getElementById("comparisonResult").innerText =
        `Previous → Risk: ${m1.risk_score ?? 0}, Bias: ${m1.bias_score ?? 0}
Current → Risk: ${m2.risk_score ?? 0}, Bias: ${m2.bias_score ?? 0}`;
}

updateUI();
</script>

</body>
