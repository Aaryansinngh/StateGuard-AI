<!DOCTYPE html>
<html>
<head>
    <title>StateGuard AI</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 30px;
        }

        h1 { text-align: center; }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .metric-box {
            flex: 1;
            background: #334155;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            background: #22c55e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        select, textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #334155;
            padding: 8px;
            text-align: center;
        }

        th { background: #334155; }

        .danger { color: #ef4444; }
        .success { color: #22c55e; }
        .medium { color: #f59e0b; }
    </style>
</head>

<body>

<h1>🚀 StateGuard AI Dashboard</h1>

<div class="container">

    <!-- MODEL -->
    <div class="card">
        <h3>Model Configuration</h3>

        <select id="model_type" onchange="updateUI()">
            <option value="sklearn">Sklearn Model (.pkl)</option>
            <option value="python">Python Model</option>
            <option value="rule">Custom Rule</option>
        </select>

        <textarea id="rule" placeholder="income > 50000 and credit_score > 650" style="display:none;"></textarea>
        <input type="file" id="file">

        <button onclick="verifyModel()">Run Verification</button>
    </div>

    <!-- RESULTS -->
    <div id="analysisSection" style="display:none;">

        <!-- METRICS -->
        <div class="card">
            <div class="row">

                <div class="metric-box">
                    <h4>Total States</h4>
                    <div id="totalStates">0</div>
                </div>

                <div class="metric-box">
                    <h4>Violations</h4>
                    <div id="violations">0</div>
                </div>

                <div class="metric-box">
                    <h4>Bias Score</h4>
                    <div id="biasScore">0</div>
                </div>

                <div class="metric-box">
                    <h4>Risk Score</h4>
                    <div id="riskScore">0</div>
                </div>

            </div>
        </div>

        <!-- SEVERITY -->
        <div class="card">
            <h3>Severity Breakdown</h3>
            <p>Critical: <span id="critical" class="danger">0</span></p>
            <p>High: <span id="high" class="medium">0</span></p>
            <p>Medium: <span id="medium">0</span></p>
        </div>

        <!-- INSIGHT -->
        <div class="card">
            <h3>System Insight</h3>
            <p id="insightText"></p>
        </div>

        <!-- GRAPH -->
        <div class="card">
            <h3>Approval Rate by Age</h3>
            <canvas id="ageChart"></canvas>
        </div>

        <!-- TABLE -->
        <div class="card">
            <h3>Counterexamples</h3>
            <div id="counterTable"></div>
        </div>

    </div>

</div>

<script>

let ageChart;

function updateUI() {
    const type = document.getElementById("model_type").value;
    document.getElementById("rule").style.display = type === "rule" ? "block" : "none";
}

async function verifyModel() {

    document.getElementById("analysisSection").style.display = "block";
    document.getElementById("totalStates").innerText = "Loading...";

    const type = document.getElementById("model_type").value;
    const rule = document.getElementById("rule").value;
    const fileInput = document.getElementById("file");

    const formData = new FormData();
    formData.append("model_type", type);
    formData.append("rule", rule);

    if (fileInput.files.length > 0) {
        formData.append("file", fileInput.files[0]);
    }

    const response = await fetch("/verify_model", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    renderMetrics(data);
    renderChart(data);
    renderTable(data);
    generateInsight(data);
}

function renderMetrics(data) {

    document.getElementById("totalStates").innerText = data.total_states_checked;

    document.getElementById("violations").innerHTML =
        `<span class="${data.violations > 0 ? 'danger' : 'success'}">${data.violations}</span>`;

    document.getElementById("biasScore").innerText = data.bias_score;
    document.getElementById("riskScore").innerText = data.risk_score;

    // Severity
    document.getElementById("critical").innerText = data.severity_breakdown.CRITICAL;
    document.getElementById("high").innerText = data.severity_breakdown.HIGH;
    document.getElementById("medium").innerText = data.severity_breakdown.MEDIUM;
}

function renderChart(data) {

    const ages = Object.keys(data.approval_rates_by_age);
    const rates = Object.values(data.approval_rates_by_age);

    if (ageChart) ageChart.destroy();

    ageChart = new Chart(document.getElementById("ageChart"), {
        type: "bar",
        data: {
            labels: ages,
            datasets: [{
                label: "Approval Rate",
                data: rates
            }]
        }
    });
}

function renderTable(data) {

    let html = `
        <table>
            <tr>
                <th>Income</th>
                <th>Credit</th>
                <th>Age</th>
                <th>Output</th>
                <th>Violation</th>
            </tr>
    `;

    data.counterexamples.forEach(v => {
        html += `
            <tr>
                <td>${v.state.income}</td>
                <td>${v.state.credit_score}</td>
                <td>${v.state.age}</td>
                <td class="danger">${v.output}</td>
                <td>${v.violated_properties ? v.violated_properties.join(", ") : "-"}</td>
            </tr>
        `;
    });

    html += "</table>";

    document.getElementById("counterTable").innerHTML = html;
}

function generateInsight(data) {

    let text = "";

    if (data.violations === 0) {
        text = "✅ Model is SAFE.";
    } else {
        text = `⚠️ ${data.violations} unsafe decisions detected.`;
    }

    if (data.risk_score > 0.3) {
        text += " 🚨 HIGH RISK SYSTEM.";
    }

    if (data.bias_score > 0.3) {
        text += " ⚠️ Bias detected.";
    }

    document.getElementById("insightText").innerText = text;
}

updateUI();

</script>

</body>
</html>
